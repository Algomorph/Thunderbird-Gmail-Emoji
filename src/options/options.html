<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gmail Emoji Reactions options</title>
  <style>
    body { font: message-box; margin: 12px; }
    label { display: flex; gap: 8px; align-items: flex-start; }
    small { display: block; opacity: 0.75; margin-top: 2px; }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="reviewBeforeSend">
    <span>
      Review before sending
      <small>Open the reaction in a compose window instead of sending it immediately.</small>
    </span>
  </label>
  <script type="module" src="options.js"></script>
</body>
</html>
